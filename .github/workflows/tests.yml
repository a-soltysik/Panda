name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  coverage:
    name: Linux GCC coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: gcc-16
          cache-key: gcc-coverage
      - name: Install software Vulkan and headless display
        run: sudo apt-get install -y mesa-vulkan-drivers xvfb xauth
      - name: Install report generator
        run: sudo apt-get install -y gcovr=7.2+really-2
      - name: Configure
        run: cmake --preset gcc-coverage
      - name: Build instrumented tests
        run: cmake --build --preset gcc-coverage
      - name: Run CPU tests
        run: ctest --preset gcc-coverage
      - name: Run benchmark smoke on lavapipe
        shell: bash
        run: >-
          xvfb-run -a env
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          build-gcc-coverage-Linux/benchmarks/panda-bench
          --profile smoke
          --output "$RUNNER_TEMP/panda-bench-smoke"
          --width 320 --height 240
          --warmup-seconds 0 --measure-seconds 1 --runs 1
      - name: Generate coverage report
        if: success() || failure()
        run: cmake --build --preset gcc-coverage --target panda_coverage_report
      - name: Upload downloadable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-coverage
          path: build-gcc-coverage-Linux/coverage/
          if-no-files-found: error
      - name: Update coverage badge
        if: success()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: build-gcc-coverage-Linux/coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-26.04
            compiler: gcc-16
            preset: gcc-tests
          - name: Linux Clang
            os: ubuntu-26.04
            compiler: llvm-22.1.8
            preset: clang-tests
          - name: Windows MSVC
            os: windows-2025
            compiler: msvc
            preset: msvc-tests
          - name: Linux GCC ASan and UBSan
            os: ubuntu-26.04
            compiler: gcc-16
            preset: gcc-sanitizers
          - name: Windows MSVC ASan
            os: windows-2025
            compiler: msvc
            preset: msvc-sanitizers
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi
