name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC analysis
            os: ubuntu-26.04
            compiler: gcc-16
            preset: gcc-quality
          - name: Windows MSVC analysis
            os: windows-2025
            compiler: msvc
            preset: msvc-quality
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: ${{ matrix.compiler }}
          analysis: 'true'
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build and analyze
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Check formatting
        run: ctest --preset ${{ matrix.preset }} -R '_format$'
