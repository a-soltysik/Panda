name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/change-scope
        id: scope

  documentation:
    name: Mermaid syntax
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: tools/documentation/package-lock.json
      - name: Configure documentation checks
        run: cmake --preset docs-checks
      - name: Check Mermaid syntax
        run: cmake --build --preset docs-checks

  unity:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC unity
            os: ubuntu-26.04
            compiler: gcc
            preset: gcc-unity
          - name: Windows MSVC unity
            os: windows-2025
            compiler: msvc
            preset: msvc-unity
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

  api-docs:
    name: Public API documentation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: gcc
          cache-key: gcc-docs
      - name: Install Doxygen
        run: sudo apt-get install -y doxygen=1.15.0+ds1-1ubuntu3
      - name: Configure
        run: cmake --preset gcc-docs
      - name: Check and generate API documentation
        run: cmake --build --preset gcc-docs
      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi
      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: panda-api-docs
          path: build-gcc-docs-Linux/docs/api/generated/html/
          if-no-files-found: error

  quality:
    name: ${{ matrix.name }} analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            name: Linux GCC
            os: ubuntu-26.04
          - compiler: msvc
            name: Windows MSVC
            os: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: ${{ matrix.compiler }}
          analysis: 'true'
          cuda: 'true'
          cache-key: ${{ matrix.compiler }}-quality-ci
      - name: Configure
        run: cmake --preset ${{ matrix.compiler }}-quality-ci
      - name: Analyze C++ sources
        run: cmake --build --preset ${{ matrix.compiler }}-quality-ci --target panda_static_analysis
      - name: Verify public headers and formatting
        run: cmake --build --preset ${{ matrix.compiler }}-quality-ci --target all_verify_interface_header_sets panda_format_checks
      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

  cuda-analysis:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CUDA analysis
            os: ubuntu-26.04
            preset: clang-cuda-analysis
          - name: Windows CUDA analysis
            os: windows-2025
            preset: clang-cuda-analysis-windows
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          compiler: llvm
          analysis: 'true'
          cuda: 'true'
          cache-key: ${{ matrix.preset }}
      - name: Configure CUDA analysis
        run: cmake --preset ${{ matrix.preset }}
      - name: Analyze CUDA host and device sources
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Upload configuration failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-analysis-configure-${{ runner.os }}
          path: build-*/cuda/CMakeFiles/CMakeConfigureLog.yaml
