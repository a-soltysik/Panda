name: Setup Panda tools
description: Install the compiler, build tools and optional quality tools.
inputs:
  compiler:
    description: Compiler family (gcc, llvm or msvc)
    required: true
  gcc-version:
    description: GCC major version
    default: '16'
  llvm-version:
    description: LLVM major version for Clang, clang-tidy and clang-format
    default: '22'
  analysis:
    description: Install static analysis and formatting tools
    default: 'false'
  cuda:
    description: Install CUDA Toolkit 13.4 for CUDA builds
    default: 'false'
  cache-key:
    description: CMake build configuration used to partition compiler outputs
    required: true
  ccache:
    description: Enable the compiler cache
    default: 'true'
runs:
  using: composite
  steps:
    - name: Restore CPM sources
      uses: actions/cache@v5
      with:
        path: .cache/cpm
        key: ${{ runner.os }}-cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
        restore-keys: ${{ runner.os }}-cpm-
    - uses: aminya/setup-cpp@v1.10.1
      with:
        compiler: >-
          ${{ inputs.compiler == 'gcc' && format('gcc-{0}', inputs.gcc-version)
          || inputs.compiler == 'llvm' && format('llvm-{0}', inputs.llvm-version)
          || 'msvc' }}
        vcvarsall: false
        architecture: x64
        cmake: '4.4.3'
        ninja: '1.13.2'
        clang-tidy: ${{ inputs.analysis == 'true' && inputs.llvm-version || 'false' }}
        clang-format: ${{ inputs.analysis == 'true' && inputs.llvm-version || 'false' }}
        cppcheck: ${{ inputs.analysis == 'true' && (runner.os == 'Linux' && '2.19.0-3' || '2.19.0') || 'false' }}
        ccache: ${{ inputs.ccache }}
        setup-cpp: false
    - name: Build tool versions
      shell: bash
      run: |
        cmake --version
        ninja --version
    - name: Cache compiler outputs
      if: inputs.ccache == 'true'
      uses: actions/cache@v5
      with:
        path: .cache/ccache
        key: panda-ccache-${{ runner.os }}-${{ inputs.compiler }}-${{ inputs.cache-key }}-${{ hashFiles('.github/actions/setup/action.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: panda-ccache-${{ runner.os }}-${{ inputs.compiler }}-${{ inputs.cache-key }}-${{ hashFiles('.github/actions/setup/action.yml') }}-
    - name: Enable compiler cache for CMake
      if: inputs.ccache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CUDA_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
    - name: Enable compiler cache for CMake on Windows
      if: inputs.ccache == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "CCACHE_DIR=$(Join-Path $env:GITHUB_WORKSPACE '.cache/ccache')"
        Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CMAKE_C_COMPILER_LAUNCHER=ccache'
        Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CMAKE_CXX_COMPILER_LAUNCHER=ccache'
        Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CMAKE_CUDA_COMPILER_LAUNCHER=ccache'
    - name: Compiler cache version
      if: inputs.ccache == 'true'
      shell: bash
      run: ccache --version
    - name: Analysis tool versions
      if: inputs.analysis == 'true'
      shell: bash
      run: |
        clang-tidy --version
        clang-format --version
        cppcheck --version
    - name: Install Linux Vulkan and window-system development files
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libvulkan-dev=1.4.341.0-1 xorg-dev libwayland-dev libxkbcommon-dev
    - name: Install Windows Vulkan SDK
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install vulkan-sdk --version=1.4.341 -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed: $LASTEXITCODE" }
        $sdk = 'C:\VulkanSDK\1.4.341.0'
        if (-not (Test-Path -LiteralPath (Join-Path $sdk 'Include\vulkan\vulkan.hpp'))) { throw "Vulkan-Hpp missing from $sdk" }
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sdk 'Bin')
    - name: Prepare Linux CUDA cache directory
      if: inputs.cuda == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo mkdir -p /usr/local/cuda-13.4
        sudo chown "$USER" /usr/local/cuda-13.4
    - name: Cache Linux CUDA Toolkit 13.4
      if: inputs.cuda == 'true' && runner.os == 'Linux'
      id: cuda-linux-cache
      uses: actions/cache@v5
      with:
        path: /usr/local/cuda-13.4
        key: ubuntu-26.04-x64-cuda-13.4.92-nvcc-cudart-curand-dev-v2
    - name: Install CUDA Toolkit 13.4 on Linux
      if: inputs.cuda == 'true' && runner.os == 'Linux' && steps.cuda-linux-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSLo "$RUNNER_TEMP/cuda-keyring.deb" https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
        sudo apt-get update
        sudo apt-get install -y cuda-nvcc-13-4=13.4.92-1 cuda-cudart-dev-13-4=13.4.92-1 libcurand-dev-13-4=10.4.4.72-1
    - name: Expose Linux CUDA Toolkit 13.4
      if: inputs.cuda == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo /usr/local/cuda-13.4/bin >> "$GITHUB_PATH"
        test -f /usr/local/cuda-13.4/include/curand_mtgp32_kernel.h
        /usr/local/cuda-13.4/bin/nvcc --version
    - name: Cache Windows CUDA Toolkit 13.4
      if: inputs.cuda == 'true' && runner.os == 'Windows'
      id: cuda-windows-cache
      uses: actions/cache@v5
      with:
        path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4
        key: windows-2025-x64-cuda-13.4.92-nvcc-cudart-crt-nvvm-curand-dev-v2
    - name: Install CUDA Toolkit 13.4 on Windows
      if: inputs.cuda == 'true' && runner.os == 'Windows' && steps.cuda-windows-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'cuda-installer.exe'
        Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/13.4.2/network_installers/cuda_13.4.2_windows_x86_64_network.exe' -OutFile $installer
        $installation = Start-Process -FilePath $installer -ArgumentList @('-s', 'nvcc_13.4', 'cudart_13.4', 'crt_13.4', 'nvvm_13.4', 'curand_13.4', 'curand_dev_13.4') -Wait -PassThru -WindowStyle Hidden
        if ($installation.ExitCode -ne 0) { throw "CUDA installer failed with exit code $($installation.ExitCode)" }
    - name: Expose Windows CUDA Toolkit 13.4
      if: inputs.cuda == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $cudaPath = Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v13.4'
        $nvcc = Join-Path $cudaPath 'bin\nvcc.exe'
        $curandHeader = Join-Path $cudaPath 'include\curand_mtgp32_kernel.h'
        if (-not (Test-Path -LiteralPath $nvcc)) { throw "CUDA compiler missing: $nvcc" }
        if (-not (Test-Path -LiteralPath $curandHeader)) { throw "cuRAND development header missing: $curandHeader" }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $cudaPath 'bin')
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "CUDA_PATH=$cudaPath"
        & $nvcc --version
